apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-v2-config
data:
  env-config.js: |
    window._env_ = {
      REACT_APP_RHSSO_URL: "https://sso.empresa-global.com/auth",
      REACT_APP_RHSSO_REALM: "erp-international",
      REACT_APP_RHSSO_CLIENT_ID: "erp-react-web",
      REACT_APP_3SCALE_API_URL: "https://api-3scale.apps.cluster.empresa-global.com/erp/v1"
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-v2-frontend
  labels:
    app: erp-v2-frontend
    app.openshift.io/runtime: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-v2-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: erp-v2-frontend
    spec:
      containers:
        - name: erp-v2-web
          image: nginxinc/nginx-unprivileged:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config-volume
              mountPath: /opt/app-root/src/env-config.js
              subPath: env-config.js
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config-volume
          configMap:
            name: erp-v2-config
---
apiVersion: v1
kind: Service
metadata:
  name: erp-v2-service
  labels:
    app: erp-v2-frontend
spec:
  selector:
    app: erp-v2-frontend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: erp-v2-route
  labels:
    app: erp-v2-frontend
spec:
  to:
    kind: Service
    name: erp-v2-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
